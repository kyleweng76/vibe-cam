<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vibe-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background (Dark Squircle) -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="#09090b" />
  
  <!-- Logo Icon: V-Shaped Aperture -->
  <g transform="translate(256, 256) scale(0.85)" filter="url(#glow)">
    <!-- Top Left Blade -->
    <path d="M-10 -50 L-130 -180 L-180 -80 Z" fill="url(#vibe-gradient)" opacity="0.9" />
    <!-- Top Right Blade -->
    <path d="M10 -50 L130 -180 L180 -80 Z" fill="url(#vibe-gradient)" opacity="0.9" />
    
    <!-- Main V Shape -->
    <path d="M-130 -130 Q0 280 130 -130 L180 -80 Q0 380 -180 -80 Z" fill="url(#vibe-gradient)" />
    
    <!-- Center Lens Reflection -->
    <circle cx="0" cy="-50" r="30" fill="white" opacity="0.2" />
  </g>
</svg>